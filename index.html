<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      * { margin: 0; padding: 0; }
      body { background: #111; overflow: hidden; }
      video {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
      #log {
        position: fixed;
        top: 10px; left: 10px;
        color: lime;
        font-size: 16px;
        z-index: 999;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="log">Iniciando...</div>
    <video id="video" autoplay playsinline></video>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.10/hls.min.js"></script>
    <script>
      var log = document.getElementById('log');
      var video = document.getElementById('video');
      var streamUrl = 'https://undivided-thinner-ventricle.ngrok-free.dev/live/index.m3u8';

      log.innerHTML = 'HLS suportado: ' + Hls.isSupported() + '<br>URL: ' + streamUrl;

      if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          log.innerHTML += '<br>Manifest OK!';
          video.play();
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          log.innerHTML += '<br>Erro: ' + data.details;
        });
      } else {
        log.innerHTML += '<br>HLS NAO suportado!';
      }
    </script>
  </body>
</html>
